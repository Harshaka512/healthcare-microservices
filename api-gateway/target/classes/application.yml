server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:mysql://localhost:3306/healthcare_gateway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
        - id: doctor-service
          uri: http://localhost:8082
          predicates:
            - Path=/doctors/**
        - id: appointment-service
          uri: http://localhost:8083
          predicates:
            - Path=/appointments/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.healthcare.gateway: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
